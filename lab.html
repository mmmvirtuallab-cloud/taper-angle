<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Virtual Lab Simulation</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css" />
    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.4.0/p5.js"></script>
</head>

<body>

    <div class="container-fluid">
        <div class="experiment-header text-center">
            <h1 class="text-white fs-3 py-2">Measurement Of Taper Angle (Internal)</h1>
        </div>
        <nav class="navbar navbar-expand-lg navbar-dark">
            <div class="container-fluid justify-content-center">
                <ul class="navbar-nav">
                    <li class="nav-item"><a class="nav-link" href="experiment.html">Experiment</a></li>
                    <li class="nav-item"><a class="nav-link" href="quiz.html">Pre Lab Quiz</a></li>
                    <li class="nav-item"><a class="nav-link" href="procedure.html">Procedure</a></li>
                    <li class="nav-item"><a class="nav-link active" href="lab.html">Lab</a></li>
                </ul>
            </div>
        </nav>
    </div>

    <div class="lab-window">
        <div class="steps-panel">
            <h3>Experiment Steps</h3>
            <div class="steps-list">
                <div class="step" data-step="1">
                    <div class="step-content">
                        <span class="step-number">1</span>
                        <span class="step-text">Click the Blue Ball to select and place it</span>
                    </div>
                </div>
                <div class="step" data-step="2">
                    <div class="step-content">
                        <span class="step-number">2</span>
                        <span class="step-text">Measure height for first ball</span>
                    </div>
                </div>
                <div class="step" data-step="3">
                    <div class="step-content">
                        <span class="step-number">3</span>
                        <span class="step-text">Place the second ball by clicking it</span>
                    </div>
                </div>
                <div class="step" data-step="4">
                    <div class="step-content">
                        <span class="step-number">4</span>
                        <span class="step-text">Measure height for second ball</span>
                    </div>
                </div>
            </div>
        </div>

        <div id="game-container" class="animate__animated animate__fadeIn"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/objects/ball.js"></script>
    <script src="js/objects/ball2.js"></script>
    <script src="js/objects/funnel.js"></script>
    <script src="js/objects/ruler.js"></script>
    <script src="js/utils/physics.js"></script>
    <script src="js/game.js"></script>
</body>

</html>
